services:
  vote:
    build:
      context: ./vote
      target: final
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request
          urllib.request.urlopen("http://localhost:8080", timeout=2)
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: "0.50"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - front-tier
      - back-tier

  result:
    build:
      context: ./result
      target: final
    ports:
      - "8081:8080"
    environment:
      PORT: 8080
      DB_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: "0.50"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - |
          require("http").get("http://localhost:8080", res => {
            process.exit(res.statusCode === 200 ? 0 : 1)
          }).on("error", () => process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - front-tier
      - back-tier

  worker:
    build:
      context: ./worker
    environment:
      DB_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: "0.50"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - back-tier

  redis:
    build:
      context: ./redis
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - "./healthchecks:/healthchecks"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: "0.50"
    restart: unless-stopped
    healthcheck:
      test: /healthchecks/redis.sh
      interval: "5s"
    networks:
      - back-tier

  db:
    build:
      context: ./postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - "db-data:/var/lib/postgresql/data"
      - "./healthchecks:/healthchecks"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/healthchecks/postgres.sh"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - back-tier

  seed:
    build:
      context: ./seed-data
    environment:
      VOTE_URL: http://vote:8080
    profiles:
      - seed
    depends_on:
      vote:
        condition: service_healthy
    networks:
      - front-tier

volumes:
  db-data:

networks:
  front-tier:
  back-tier:

secrets:
  db_password:
    file: ./secrets/db_password.txt